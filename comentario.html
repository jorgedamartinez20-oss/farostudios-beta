*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 17px/1.55 var(--body);color:var(--ink);background:var(--marfil);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p{margin:0;font-weight:400}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px;border-radius:10px}
.ico{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}

/* fondo suave con orbes, como la web */
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(70px);pointer-events:none}
body::before{width:420px;height:420px;left:-140px;top:38%;background:rgba(139,26,42,.10)}
body::after{width:380px;height:380px;right:-120px;bottom:-60px;background:rgba(184,160,106,.18)}

/* encabezado borgoña */
.hero{position:relative;z-index:1;color:var(--marfil);text-align:center;padding:calc(30px + env(safe-area-inset-top)) 22px 118px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0,#a3243a 0,var(--borg) 52%,#6e1321 100%)}
.hero::before{content:"";position:absolute;right:-30px;top:-30px;width:290px;height:560px;background:var(--oro);opacity:.12;-webkit-mask:var(--iso) center/contain no-repeat;mask:var(--iso) center/contain no-repeat;pointer-events:none;animation:flo 9s ease-in-out infinite}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
.hero>*{position:relative}
.logo{display:block;height:54px;width:auto;margin:0 auto 24px}
.eti{font-size:.8rem;letter-spacing:.34em;color:var(--oro-c);font-weight:700;text-transform:uppercase}
.hero h1{font:400 clamp(3rem,11vw,5.2rem)/.95 var(--display);letter-spacing:.06em;margin:12px 0 14px}
.sub{max-width:34em;margin:0 auto;color:#f1dfe0;font-size:1.06rem}
.hero.slim .eti,.hero.slim h1,.hero.slim .sub{display:none}.hero.slim{padding-bottom:96px}.hero.slim .logo{margin-bottom:0}

/* tarjeta */
.wrap{position:relative;z-index:2;width:min(660px,100% - 28px);margin:-74px auto 0;padding-bottom:calc(46px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,40px);box-shadow:0 2px 0 var(--line),0 40px 70px -36px rgba(94,16,28,.55)}
.sec{padding:26px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:4px}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
.sh .n{font:400 2.4rem/1 var(--display);color:var(--oro);letter-spacing:.04em}
.sh h2{font:400 1.7rem/1.1 var(--display);letter-spacing:.07em}
.sh small{display:block;color:var(--muted);font-size:.92rem;margin-top:3px;letter-spacing:0;font-family:var(--body)}
.err{color:var(--borg);font-size:.95rem;font-weight:700;margin-top:10px}
.err:empty{display:none}
.note{display:flex;gap:9px;align-items:flex-start;margin-top:10px;color:var(--muted);font-size:.88rem;line-height:1.45}
.note .ico{margin-top:2px;color:var(--oro)}

.reveal.on>div{overflow:visible}

    s.onclick=()=>{F.estrellas=i+1;pintaE(F.estrellas);$('#e4').textContent='';stars.forEach(x=>x.classList.remove('pop'));void s.offsetWidth;s.classList.add('pop')};
    s.onmouseenter=()=>pintaE(i+1);s.onfocus=()=>pintaE(i+1);
    s.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();F.estrellas=Math.min(5,(F.estrellas||0)+1);pintaE(F.estrellas);stars[F.estrellas-1].focus()}else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();F.estrellas=Math.max(1,(F.estrellas||2)-1);pintaE(F.estrellas);stars[F.estrellas-1].focus()}};
  });
  $('.stars').onmouseleave=()=>pintaE(F.estrellas);
  $('.stars').addEventListener('focusout',()=>setTimeout(()=>{if(!$('.stars').contains(document.activeElement))pintaE(F.estrellas)},0));
  $('#f-txt').oninput=e=>{F.texto=e.target.value;$('#cnt').textContent=F.texto.length+' / 1500';$('#e5').textContent=''};
  $('#f-mej').oninput=e=>{F.mejora=e.target.value};
  $('#send').onclick=enviar;
}

function validar(){
  const e={};
  if(!F.tipo)e.e1='Elige cómo trabajaste con nosotros.';
  if(F.tipo==='empresa'&&F.empresa.trim().length<1)e.e2='Escribe el nombre de la empresa.';
  else if(F.nombre.trim().length<2)e.e2='Escribe tu nombre.';
  if(!F.servicio)e.e3=F.tipo==='empresa'?'Elige qué producción cubrimos.':'Elige el trabajo que hicimos juntos.';
  if(!F.estrellas)e.e4='Toca las estrellas para puntuarnos.';
  if(F.texto.trim().length<10)e.e5='Cuéntanos un poco más (al menos una frase).';
  return e;
}

async function enviar(){
  const er=validar();['e1','e2','e3','e4','e5'].forEach(k=>{const n=$('#'+k);if(n)n.textContent=er[k]||''});
  const prim=Object.keys(er)[0];
  if(prim){$('#'+prim).closest('.sec').scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});return}
  const b=$('#send');b.disabled=true;b.querySelector('span').textContent='ENVIANDO…';$('#te').innerHTML='';
  const ser=F.servicio==='Otro'&&F.otro.trim()?F.otro.trim().slice(0,60):F.servicio;
  try{
    const r=await rpc('rs_enviar_publico',{p_tipo:F.tipo,p_empresa:F.tipo==='empresa'?F.empresa.trim():'',p_nombre:F.nombre.trim(),p_servicio:ser,p_estrellas:F.estrellas,p_texto:F.texto.trim(),p_mejora:F.mejora.trim()});
    if(r&&r.ok){const d={tipo:F.tipo,codigo:r.codigo||'',descuento:r.descuento||'',condicion:r.condicion||'',vence:r.vence||'',nombre:F.nombre.trim().split(/\s+/)[0]};ls(LSK,d);vistaGracias(d,true);return}
    const msg={limite:'Hay muchos comentarios llegando en este momento. Inténtalo de nuevo en unos minutos.',repetido:'Ya recibimos este mismo comentario. ¡Gracias!'}[r&&r.error];
    if(msg){b.disabled=false;b.querySelector('span').textContent='ENVIAR MI COMENTARIO';$('#te').innerHTML='<div class="top-err">'+msg+'</div>';return}
    throw new Error('x');
  }catch(x){
    b.disabled=false;b.querySelector('span').textContent='ENVIAR MI COMENTARIO';
    $('#te').innerHTML='<div class="top-err">No se pudo enviar. Revisa tu conexión e inténtalo de nuevo; lo que escribiste sigue aquí.</div>';
  }
}

function vistaGracias(d,nuevo){
  $('#hero').classList.add('slim');
  const n=parseFloat(d.descuento),cod=d.codigo;
  const share='Hola, te comparto mi código de descuento de Faro Studios: '+cod+' ('+(n>0?n+'%':'descuento')+'). Puedes escribirles aquí: '+WA;
  APP.innerHTML=`<div class="ok">
    <div class="chk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>¡Gracias${d.nombre?', '+esc(d.nombre):''}!</h2>
    ${cod?`<p class="lead">${nuevo?'Tu comentario ya está con nosotros y significa muchísimo.':'Aquí sigue tu regalo de agradecimiento.'} Este es tu código:</p>
    <div class="ticket"><div class="tk-a"><small>TU CÓDIGO DE AGRADECIMIENTO</small><div class="cd" id="cod">${esc(cod)}</div><p>${esc(d.condicion||'Menciona tu código al reservar.')}</p>${d.vence?`<p class="vig"><b>Vale hasta el ${esc(fvence(d.vence))}</b></p>`:''}</div>
      <div class="tk-b"><div>${n>0?`<b>${n}%</b><span>DE DESCUENTO</span>`:`<b>REGALO</b><span>PARA TI</span>`}</div></div></div>
    <div class="usos"><div class="uso"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><div><b>1 uso para ti</b><span>En tu próxima sesión con nosotros.</span></div></div>
      <div class="uso"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 4.5a3.5 3.5 0 0 1 0 7M18 14.4c2.2.6 3.5 2.4 3.5 5.6"/></svg><div><b>1 uso para un amigo</b><span>Compártelo con quien quieras.</span></div></div></div>
    <div class="acts"><button type="button" class="btn o" id="cp"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copiar código</span></button>
      <a class="btn w" id="wa" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12Z"/></svg><span>Enviar a un amigo</span></a></div>
    <p class="fine">Guarda una captura de esta pantalla o copia tu código. Cada uso se canjea una sola vez${d.vence?' y vale hasta esa fecha':''}.</p>`
    :`<p class="lead">${nuevo?'Tu comentario ya está con nosotros y significa muchísimo para todo el equipo.':'Ya recibimos tu comentario.'} Fue un gusto trabajar con ${d.tipo==='empresa'?'ustedes':'tú'}.</p>
    <div class="acts"><a class="btn o" href="./"><span>Conocer más de Faro</span></a></div>`}
    <button type="button" class="again" id="again">Dejar otro comentario</button></div>`;
  if(cod){
    $('#wa').href='https://wa.me/?text='+encodeURIComponent(share);
    $('#cp').onclick=async()=>{const b=$('#cp').lastChild;try{await navigator.clipboard.writeText(cod)}catch(e){const r=document.createRange();r.selectNodeContents($('#cod'));const s=getSelection();s.removeAllRanges();s.addRange(r)}b.textContent='¡Copiado!';setTimeout(()=>b.textContent='Copiar código',1800)};
  }
  $('#again').onclick=()=>{ls(LSK,null);vistaForm();scrollTo({top:0})};
  scrollTo({top:0,behavior:'auto'});
  if(nuevo&&!reduce)confeti();
}

function confeti(){
  const c=$('#cf'),x=c.getContext('2d');c.hidden=false;const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const col=['#B8A06A','#E0CD9A','#8B1A2A','#D98A96','#F5F2EE'],P=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.28,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,w:5+Math.random()*7,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:col[(Math.random()*col.length)|0]}));
  let t=0;(function f(){t++;x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.22;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-t/170);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(t<170)requestAnimationFrame(f);else{x.clearRect(0,0,innerWidth,innerHeight);c.hidden=true}})();
}

(async function(){
  const g=ls(LSK);
  try{const r=await rpc('rs_info');if(r)INFO={descuento:r.descuento||'',condicion:r.condicion||'',meses:r.meses||'5'}}catch(e){}
  if(g&&g.tipo){vistaGracias(g,false);return}
  vistaForm();
})();
</script>
