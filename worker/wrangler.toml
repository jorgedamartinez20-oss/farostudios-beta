name = "faro-archivos"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[r2_buckets]]
binding = "PRIVADO"
bucket_name = "faro-privado"

[[r2_buckets]]
binding = "PUBLICO"
bucket_name = "faro-publico"

[vars]
# La llave "publishable" de Supabase es pública por diseño; no es un secreto.
SUPABASE_URL = "https://keivqvsgdfhthouzlqxo.supabase.co"
SUPABASE_KEY = "sb_publishable_5nj3M7rjQs3phGU6u2uNqw_3tjTL6PE"
ADMIN_EMAIL = "reservas@farostudios.net"
# Páginas que pueden hablar con este servicio (separadas por coma). Agrega aquí la dirección github.io del beta.
ORIGENES = "https://jorgedamartinez20-oss.github.io,https://farostudios.net,https://www.farostudios.net"

# Secreto (NO va aquí): FIRMA_SECRETO, para los enlaces temporales de descarga.
#   npx wrangler secret put FIRMA_SECRETO

# Respaldo diario: 12:00 hora de Guatemala = 18:00 UTC. Varios disparos seguidos porque el respaldo trabaja por pasos
# (si ya terminó, los demás no hacen nada).
[triggers]
crons = ["0 18 * * *", "3 18 * * *", "6 18 * * *", "9 18 * * *", "12 18 * * *"]

# Secretos nuevos (NO van aquí):
#   SUPABASE_SERVICE_KEY  llave service_role de Supabase (para respaldar todas las tablas)
#   GITHUB_TOKEN          solo si el repositorio fuera privado
