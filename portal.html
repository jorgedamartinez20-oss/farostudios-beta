*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font:400 var(--t0)/1.55 var(--body);color:var(--ink);background:var(--paper,#F6F2EA);background-color:#F6F2EA;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.09;background-image:radial-gradient(circle,#252528 1px,transparent 1.2px);background-size:26px 26px}
h1,h2,h3,h4,p{margin:0;font-weight:400}
h1,h2,h3{font-family:var(--display);letter-spacing:.04em;line-height:1}
.ico{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.iso{display:inline-block;background:currentColor;-webkit-mask:var(--iso) center/contain no-repeat;mask:var(--iso) center/contain no-repeat;aspect-ratio:160/311}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--t);outline-offset:3px;border-radius:8px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:12px clamp(14px,3vw,34px);background:var(--pizarra);color:var(--marfil);box-shadow:0 6px 0 rgba(37,37,40,.12)}
.brand{display:flex;align-items:center;gap:12px}
.brand .iso{height:44px;color:var(--marfil)}
.brand b{font:400 1.6rem/1 var(--display);letter-spacing:.1em;display:block}
.brand small{font-size:var(--tm);color:#C9C4BA;display:block}
.seg{margin-left:auto;display:flex;background:rgba(255,255,255,.1);border-radius:16px;padding:5px;gap:4px}
.seg button{border:0;background:none;color:var(--marfil);padding:10px 22px;border-radius:12px;font-size:var(--t0)}
.seg button[aria-pressed="true"]{background:var(--y);color:var(--pizarra);box-shadow:0 3px 0 var(--yd)}
.demo-note{background:var(--y);color:var(--pizarra);text-align:center;padding:8px 14px;font-size:var(--tm);position:relative;z-index:2}

/* ---------- estructura ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:268px minmax(0,1fr);gap:28px;max-width:1360px;margin:0 auto;padding:28px clamp(14px,3vw,34px) 60px}
.side{position:sticky;top:96px;align-self:start;display:grid;gap:12px}
.me{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;text-align:center;box-shadow:var(--sh);display:grid;gap:8px;justify-items:center}
.av{width:84px;height:84px;border-radius:50%;background:var(--c);box-shadow:0 5px 0 var(--cd);display:grid;place-items:center;color:var(--marfil)}
.av .iso{height:50px}
.me h3{font-size:var(--t1)}
.me small{color:var(--muted);font-size:var(--tm)}
.xpbar{width:100%;height:14px;border-radius:99px;background:rgba(37,37,40,.12);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.1)}
.xpbar i{display:block;height:100%;border-radius:99px;background:var(--y);box-shadow:inset 0 -3px 0 var(--yd);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.nav{display:grid;gap:8px}
.nav button{display:flex;align-items:center;gap:14px;border:2px solid transparent;background:none;border-radius:16px;padding:13px 16px;text-align:left;font-size:var(--t0);transition:transform .2s,background .2s}
.nav button:hover{background:rgba(37,37,40,.06);transform:translateX(4px)}
.nav button[aria-current="page"]{background:var(--card);border-color:var(--line);box-shadow:0 4px 0 var(--line);color:var(--borgona)}
.nav .ico{width:1.6em;height:1.6em}
.nav .dot{margin-left:auto;min-width:26px;height:26px;border-radius:99px;background:var(--c);color:#fff;font-size:.9rem;display:grid;place-items:center;box-shadow:0 2px 0 var(--cd)}
main{min-width:0}
.page{animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph{margin-bottom:22px;text-align:center}
.ph h1{font-size:clamp(2.6rem,6vw,var(--t3))}
.ph p{color:var(--muted);font-size:var(--t0);margin-top:8px}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:clamp(20px,3vw,30px);box-shadow:var(--sh);text-align:center;position:relative}
.card h2{font-size:var(--t1);margin-bottom:6px}
.card .sub{color:var(--muted);font-size:var(--tm)}
.tile{border-radius:24px;padding:24px 18px;color:#fff;text-align:center;display:grid;gap:4px;justify-items:center;position:relative;overflow:hidden;transition:transform .25s}
.tile:hover{transform:translateY(-4px) rotate(-.6deg)}
.tile .ico{width:2.2em;height:2.2em;animation:bob 3.4s ease-in-out infinite}
.tile b{font:400 var(--t2)/1 var(--display);letter-spacing:.03em}
.tile span{font-size:var(--tm)}
.tile.y{background:var(--y);color:var(--pizarra);box-shadow:0 7px 0 var(--yd),0 24px 30px -22px rgba(0,0,0,.6)}
.tile.c{background:var(--c);box-shadow:0 7px 0 var(--cd),0 24px 30px -22px rgba(0,0,0,.6)}
.tile.t{background:var(--t);box-shadow:0 7px 0 var(--td),0 24px 30px -22px rgba(0,0,0,.6)}
.tile.g{background:var(--g);box-shadow:0 7px 0 var(--gd),0 24px 30px -22px rgba(0,0,0,.6)}
.tile.b{background:var(--b);box-shadow:0 7px 0 var(--bd),0 24px 30px -22px rgba(0,0,0,.6)}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:14px 26px;background:var(--t);color:#fff;box-shadow:0 5px 0 var(--td);transition:transform .12s,box-shadow .12s;font-size:var(--t0);text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--td)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--td)}
.btn.y{background:var(--y);color:var(--pizarra);box-shadow:0 5px 0 var(--yd)}.btn.y:hover{box-shadow:0 7px 0 var(--yd)}.btn.y:active{box-shadow:0 1px 0 var(--yd)}
.btn.c{background:var(--c);box-shadow:0 5px 0 var(--cd)}.btn.c:hover{box-shadow:0 7px 0 var(--cd)}
.btn.g{background:var(--g);box-shadow:0 5px 0 var(--gd)}.btn.g:hover{box-shadow:0 7px 0 var(--gd)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.wa{background:#25D366;color:#073b1a;box-shadow:0 5px 0 #17944a}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0 0 18px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:9px 18px;font-size:var(--tm);box-shadow:0 3px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--pizarra);color:var(--marfil);border-color:var(--pizarra);box-shadow:0 3px 0 #000}
.pill{display:inline-block;border-radius:99px;padding:4px 14px;font-size:var(--tm);color:#fff}
.pill.ok{background:var(--g)}.pill.warn{background:var(--y);color:var(--pizarra)}.pill.no{background:var(--c)}.pill.mute{background:rgba(37,37,40,.55)}

/* ---------- inicio ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:center;background:var(--pizarra);color:var(--marfil);border-radius:28px;padding:clamp(22px,4vw,40px);box-shadow:0 8px 0 #000,0 30px 40px -24px rgba(0,0,0,.7);text-align:left;overflow:hidden;position:relative}
.hero h1{font-size:clamp(2.6rem,6vw,var(--t3));color:var(--marfil)}
.hero h1 em{font-style:normal;color:var(--y)}
.hero p{color:#D9D4CA;margin-top:10px;max-width:34ch}
.hero .row{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap}
.beam{position:absolute;right:-60px;top:-40px;width:420px;height:420px;background:conic-gradient(from 250deg,transparent 0 40deg,rgba(224,182,62,.3) 60deg,transparent 80deg);animation:spin 9s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:relative;width:min(220px,44vw);aspect-ratio:1;display:grid;place-items:center;text-align:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:16;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.16)}
.ring .fg{stroke:var(--y);stroke-dasharray:var(--len) 999;stroke-dashoffset:var(--len);animation:fill 1.6s .3s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 0 8px rgba(224,182,62,.6))}
@keyframes fill{to{stroke-dashoffset:calc(var(--len) - var(--pct) * var(--len))}}
.ring b{font:400 var(--t3)/1 var(--display);color:var(--y);display:block;position:relative}
.ring span{font-size:var(--tm);color:#D9D4CA;position:relative;display:block}
.next{display:grid;gap:12px;justify-items:center}
.next .when{font:400 var(--t2)/1 var(--display);color:var(--borgona)}
.task-mini{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(37,37,40,.05);border-radius:16px;padding:12px 16px;margin-top:10px}
.bubble-tip{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;text-align:left}
.mascot{width:84px;height:84px;border-radius:50%;background:var(--pizarra);display:grid;place-items:center;color:var(--y);box-shadow:0 5px 0 #000;position:relative;overflow:hidden}
.mascot .iso{height:52px}
.say{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 22px;position:relative;box-shadow:0 4px 0 var(--line)}
.say::before{content:"";position:absolute;left:-12px;top:30px;width:20px;height:20px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* ---------- camino ---------- */
.wayw{position:relative;width:100%;overflow:hidden}.way{position:absolute;left:50%;top:0;width:380px;margin-left:-190px;transform-origin:50% 0}
.way>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.unit{position:absolute;left:0;right:0;text-align:center}
.unit span{display:inline-block;background:var(--b);color:#fff;border-radius:16px;padding:10px 22px;box-shadow:0 5px 0 var(--bd);font-size:var(--t0)}
.node{position:absolute;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;transition:transform .15s}
.node .ico{width:2em;height:2em}
.node:hover{transform:scale(1.08)}
.node.done{background:var(--g);box-shadow:0 8px 0 var(--gd)}
.node.now{background:var(--y);color:var(--pizarra);box-shadow:0 8px 0 var(--yd);animation:pulse 1.8s ease-in-out infinite}
.node.lock{background:#B9B5AC;box-shadow:0 8px 0 #8E8A81;color:#fff}
.node.chest{background:var(--c);box-shadow:0 8px 0 var(--cd)}
.node.chest.lock{background:#B9B5AC;box-shadow:0 8px 0 #8E8A81}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 8px 0 var(--yd),0 0 0 14px rgba(224,182,62,.28)}}
.start{position:absolute;transform:translate(-30%,-100%);background:var(--pizarra);color:#fff;border-radius:14px;padding:6px 14px;font-size:var(--tm);white-space:nowrap;animation:bob 2.4s infinite}
.sheet{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;z-index:40;width:min(440px,92vw);background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 0 rgba(37,37,40,.2),0 40px 60px -20px rgba(0,0,0,.6);text-align:center;transition:.3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.sheet h3{font-size:var(--t1);margin-bottom:6px}

/* ---------- tablero ---------- */
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.col{background:rgba(37,37,40,.06);border-radius:24px;padding:16px;display:grid;gap:14px;min-height:200px;box-shadow:inset 0 3px 0 rgba(0,0,0,.06)}
.col>h3{font-size:var(--t1);text-align:center}
.col>h3 small{font:400 var(--tm)/1 var(--body);color:var(--muted);display:block;margin-top:4px;letter-spacing:0}
.job{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;text-align:center;box-shadow:0 4px 0 var(--line);display:grid;gap:8px;justify-items:center;transition:transform .2s}
.job:hover{transform:translateY(-3px)}
.job .xp{color:var(--yd);display:inline-flex;gap:6px;align-items:center;font-size:var(--tm)}
.job .btn{padding:9px 18px;font-size:var(--tm)}
.col.c1 .job{border-top:8px solid var(--c)}.col.c2 .job{border-top:8px solid var(--y)}.col.c3 .job{border-top:8px solid var(--g)}

/* ---------- avance ---------- */
.radar{width:min(360px,100%);margin:0 auto;display:block;overflow:visible}
.radar .poly{fill:rgba(63,167,163,.35);stroke:var(--t);stroke-width:3;transform-origin:center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scale(.1);opacity:0}}
.skills{display:grid;gap:10px;margin-top:10px}
.skill{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;background:rgba(37,37,40,.05);border-radius:14px;padding:10px 16px}
.stars{display:inline-flex;gap:3px;color:var(--y)}
.stars .ico{width:1.2em;height:1.2em;fill:var(--y)}
.stars .off .ico,.stars .off{fill:none;color:rgba(37,37,40,.25)}
.stars .off .ico{fill:none}
.linech{width:100%;height:auto;overflow:visible}
.linech .area{fill:rgba(224,182,62,.25)}
.linech .ln{fill:none;stroke:var(--c);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.8s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.linech text{font:400 13px var(--body);fill:var(--muted)}
.linech .dot{fill:var(--card);stroke:var(--c);stroke-width:4}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:240px;margin-top:10px}
.bars div{flex:1;max-width:52px;display:grid;gap:6px;justify-items:center;align-content:end;height:100%}
.bars i{display:block;width:100%;border-radius:12px 12px 6px 6px;background:var(--t);box-shadow:inset 0 -6px 0 var(--td);height:0;animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i) * .07s)}
.bars div.today i{background:var(--y);box-shadow:inset 0 -6px 0 var(--yd)}
@keyframes rise{to{height:var(--h)}}
.bars span{font-size:var(--tm);color:var(--muted)}
.tl{display:grid;gap:0;text-align:left;margin-top:10px}
.tl li{list-style:none;display:grid;grid-template-columns:34px 1fr;gap:14px;padding-bottom:18px;position:relative}
.tl li::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:3px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .pt{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--gd)}
.tl .pt .ico{width:18px;height:18px}
.tl small{color:var(--muted);font-size:var(--tm);display:block}

/* ---------- material ---------- */
.mat{display:grid;gap:10px;justify-items:center;text-align:center}
.mat .ic{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;color:#fff}
.mat .ic .ico{width:34px;height:34px}
.mat .ic.pdf{background:var(--c);box-shadow:0 5px 0 var(--cd)}.mat .ic.audio{background:var(--t);box-shadow:0 5px 0 var(--td)}.mat .ic.video{background:var(--b);box-shadow:0 5px 0 var(--bd)}.mat .ic.mine{background:var(--y);color:var(--pizarra);box-shadow:0 5px 0 var(--yd)}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:22px}
.eq i{width:4px;background:var(--t);border-radius:2px;height:6px}
.playing .eq i{animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}.eq i:nth-child(4){animation-delay:.45s!important}
@keyframes eq{50%{height:22px}}
.drop{border:3px dashed var(--t);border-radius:24px;padding:28px;background:rgba(63,167,163,.08);display:grid;gap:10px;justify-items:center;transition:.2s;cursor:pointer}
.drop:hover{background:rgba(63,167,163,.16);transform:scale(1.01)}
.drop input{display:none}

/* ---------- logros ---------- */
.badge{display:grid;gap:8px;justify-items:center;text-align:center}
.bd{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative;transition:transform .3s}
.bd .ico{width:46px;height:46px}
.bd.on{box-shadow:0 7px 0 rgba(0,0,0,.25)}
.bd.on:hover{transform:rotate(-8deg) scale(1.08)}
.bd.on::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px dashed rgba(255,255,255,.55);animation:spin 14s linear infinite}
.bd.off{background:#C9C5BC!important;box-shadow:0 7px 0 #A6A298}
.diploma{border-radius:20px;padding:26px 20px;background:var(--marfil);border:3px double var(--oro);box-shadow:var(--sh);display:grid;gap:8px;justify-items:center;position:relative}
.diploma .iso{height:64px;color:var(--borgona)}
.diploma h3{font-size:var(--t1);color:var(--borgona)}
.diploma.lock{filter:grayscale(1);opacity:.55}

/* ---------- chat ---------- */
.chat{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:min(640px,72vh);background:rgba(37,37,40,.05);border-radius:24px;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.06)}
.msgs{min-width:0;overflow:auto;padding:20px;display:grid;gap:12px;align-content:start}
.m{max-width:78%;padding:12px 18px;border-radius:20px;box-shadow:0 3px 0 var(--line);animation:in .3s;text-align:left}
.m.in{background:var(--card);border:2px solid var(--line);border-bottom-left-radius:6px;justify-self:start}
.m.out{background:var(--t);color:#fff;border-bottom-right-radius:6px;justify-self:end;box-shadow:0 3px 0 var(--td)}
.m small{display:block;font-size:.9rem;opacity:.75}
.typing{display:inline-flex;gap:5px}.typing i{width:9px;height:9px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.send{display:flex;gap:10px;padding:14px;background:var(--card);border-top:2px solid var(--line)}
.send>*{min-width:0}.send input{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:12px 18px;font:inherit;background:#fff}
.sug{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}

/* ---------- finanzas ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0 10px;text-align:center}
.tbl th{font-weight:400;color:var(--muted);font-size:var(--tm);padding:0 10px}
.tbl td{background:rgba(37,37,40,.05);padding:14px 10px;font-size:var(--tm)}
.tbl td:first-child{border-radius:16px 0 0 16px}.tbl td:last-child{border-radius:0 16px 16px 0}
.money{font:400 var(--t3)/1 var(--display);color:var(--borgona)}
.pay{background:var(--pizarra);color:var(--marfil);border-radius:24px;padding:26px;display:grid;gap:12px;justify-items:center;box-shadow:0 7px 0 #000}
.pay small{color:#D9D4CA}
.kid{display:flex;gap:12px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.kid button{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:10px 20px 10px 10px;box-shadow:0 4px 0 var(--line)}
.kid button[aria-pressed="true"]{border-color:var(--borgona);box-shadow:0 4px 0 var(--borgona)}
.kid .av{width:52px;height:52px;box-shadow:0 3px 0 rgba(0,0,0,.2)}.kid .av .iso{height:30px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal b{font-weight:400;color:var(--muted);font-size:var(--tm)}
.cal i{font-style:normal;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:rgba(37,37,40,.06);font-size:var(--tm)}
.cal i.p{background:var(--g);color:#fff;box-shadow:0 3px 0 var(--gd)}.cal i.n{background:var(--c);color:#fff;box-shadow:0 3px 0 var(--cd)}.cal i.f{background:var(--y);color:var(--pizarra);box-shadow:0 3px 0 var(--yd)}.cal i.h{outline:3px dashed var(--borgona);outline-offset:2px}
.ls{display:grid;gap:10px;text-align:left}
.ls .it{display:flex;align-items:center;gap:14px;background:rgba(37,37,40,.05);border-radius:16px;padding:12px 16px}
.ls .it small{color:var(--muted);display:block;font-size:var(--tm)}
.ls .it .btn{margin-left:auto;padding:9px 16px;font-size:var(--tm)}

/* ---------- confeti y XP ---------- */
.pop{position:fixed;z-index:60;pointer-events:none;font:400 var(--t2)/1 var(--display);color:var(--yd);text-shadow:0 3px 0 #fff;animation:pop 1.4s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-120px) scale(1.4)}}
.cf{position:fixed;z-index:59;width:10px;height:14px;pointer-events:none;animation:cf 1.3s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* ---------- móvil ---------- */
@media (max-width:960px){
  .app{grid-template-columns:1fr;padding-bottom:110px}
  .side{position:static}.me{grid-template-columns:auto minmax(0,1fr);column-gap:16px;row-gap:4px;text-align:left;justify-items:start;align-items:center;padding:16px 18px}.me>*{min-width:0;width:100%}.me .av{grid-row:1/5;width:64px;height:64px}.me .av .iso{height:38px}.me h3{font-size:1.6rem}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;gap:2px;background:var(--pizarra);padding:8px 8px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;box-shadow:0 -6px 0 rgba(0,0,0,.12)}
  .nav button{flex:1;min-width:64px;flex-direction:column;gap:4px;padding:8px 4px;font-size:.82rem;color:#D9D4CA;text-align:center}
  .nav button:hover{transform:none;background:none}
  .nav button[aria-current="page"]{background:var(--y);color:var(--pizarra);border-color:transparent;box-shadow:0 3px 0 var(--yd)}
  .nav .dot{position:absolute;margin:-26px -24px 0 0;min-width:20px;height:20px;font-size:.75rem}
  .nav button{position:relative}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kan{grid-template-columns:1fr}
  .sheet{bottom:96px}
}
@media (max-width:700px){
  .g2,.g3{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}.hero p{margin-inline:auto}.hero .row{justify-content:center}
  .brand small{display:none}.brand b{font-size:1.15rem;white-space:nowrap;letter-spacing:.06em}.seg .lg{display:none}.brand .iso{height:36px}.top{gap:10px}.seg button{padding:8px 12px;font-size:.95rem;white-space:nowrap}
  .bubble-tip{grid-template-columns:1fr;justify-items:center;text-align:center}.say::before{display:none}
  .tbl .hm{display:none}.tbl td,.tbl th{padding-inline:6px}.tbl .btn{padding:8px 10px!important}.tbl{table-layout:fixed}.card{padding:18px 14px}
  .m{max-width:90%}
  .tile b{font-size:2.3rem}
}

/* piel Studios (clientes) */
body.sv{--y:#B8A06A;--yd:#8C7746;--c:#8B1A2A;--cd:#5E101C;--t:#3A3A3A;--td:#1C1C1E;--g:#6B6256;--gd:#4A443C;--b:#252528;--bd:#000}
body.sv .tile.y,body.sv .btn.y,body.sv .seg button[aria-pressed="true"]{color:var(--pizarra)}
.lnk{border:0;background:none;text-decoration:underline;font-size:inherit;color:inherit;padding:0 4px}

  try{const r=await fetch(SBU+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token)return null;
    SES={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000};saveSes();return SES}catch(e){return null}}

  if(!SES||!SES.refresh)return false;
  try{const r=await fetch(SBU+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SES.refresh})});
    const j=await r.json();if(!r.ok||!j.access_token)return false;
    SES={access:j.access_token,refresh:j.refresh_token||SES.refresh,exp:Date.now()+(j.expires_in||3600)*1000};saveSes();return true}catch(e){return false}}
async function api(path,o){
  o=o||{};if(SES&&SES.exp-60000<Date.now())await refreshSes();
  const go=()=>fetch(SBU+path,{method:o.method||'GET',headers:Object.assign({apikey:SBK,Authorization:'Bearer '+(SES?SES.access:SBK)},o.raw?{}:{'Content-Type':'application/json'},o.headers||{}),body:o.raw?o.body:(o.body?JSON.stringify(o.body):undefined)});
  let r=await go();if(r.status===401&&await refreshSes())r=await go();
  if(r.status===401){salir(true);throw new Error('sesion')}return r}
const rows=async(t,qs)=>{try{const r=await api('/rest/v1/'+t+'?'+qs);return r.ok?await r.json():[]}catch(e){return[]}};
async function abrir(bucket,ruta){
  if(!ruta)return;
  if(/^https?:/i.test(ruta)){window.open(ruta,'_blank','noopener');return}
  const w=window.open('','_blank');
  try{const r=await api('/storage/v1/object/sign/'+bucket+'/'+ruta,{method:'POST',body:{expiresIn:3600}});const j=await r.json();
    if(!r.ok||!j.signedURL)throw 0;const u=SBU+'/storage/v1'+j.signedURL;if(w)w.location=u;else location.href=u}
  catch(e){if(w)w.close();aviso('No se pudo abrir el archivo')}}
async function urlFirmada(bucket,ruta){
  if(/^https?:/i.test(ruta))return ruta;
  try{const r=await api('/storage/v1/object/sign/'+bucket+'/'+ruta,{method:'POST',body:{expiresIn:3600}});const j=await r.json();return j.signedURL?SBU+'/storage/v1'+j.signedURL:null}catch(e){return null}}
function aviso(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3200)}

const fecha=(f,o)=>{if(!f)return '';const d=new Date(String(f).slice(0,10)+'T12:00:00');return d.toLocaleDateString('es-GT',o||{weekday:'long',day:'numeric',month:'long'})};
const corta=f=>fecha(f,{day:'numeric',month:'short'});

const Q=n=>'Q'+Number(n||0).toFixed(2);

const S={doc:null,rol:null,page:null,perfil:null,kid:null,kids:[],D:{},cli:null,tab:'al',timer:0};

/* ---------- carga de datos ---------- */
async function cargarAlumno(id){
  const f='estudiante_id=eq.'+id;
  const [e,cl,ma,ta,ev,ha,lo,re,di,ms,fa]=await Promise.all([
    rows('ac_estudiantes','id=eq.'+id+'&select=*'),rows('ac_clases',f+'&order=fecha.asc,hora.asc'),rows('ac_materiales',f+'&order=creado.desc'),
    rows('ac_tareas',f+'&order=creado.asc'),rows('ac_evaluaciones',f+'&order=fecha.asc'),rows('ac_habilidades',f+'&order=habilidad.asc'),
    rows('ac_logros',f+'&order=fecha.desc'),rows('ac_recomendaciones',f+'&order=creado.desc&limit=1'),rows('ac_diplomas',f+'&order=fecha.desc'),
    rows('ac_mensajes',f+'&order=creado.asc&limit=200'),rows('ac_facturas',f+'&order=emision.desc')]);
  const g=(e&&e[0])||{};const hoy=hoyISO();
  const general=await rows('ac_materiales','estudiante_id=is.null&order=creado.desc');
  const pend=fa.filter(x=>x.estado==='pendiente');
  const prox=cl.find(c=>(c.estado==='programada'||c.estado==='reprogramada')&&c.fecha>=hoy);
  return{id,nombre:g.nombre||'',corto:g.apodo||String(g.nombre||'').split(' ')[0],area:(g.area==='ingles'?'Inglés':'Música')+(g.detalle?' · '+g.detalle:''),areaId:g.area,
    mod:g.modalidad==='online'?'En línea':'Presencial',xp:g.xp||0,racha:g.racha||0,pagaAlumno:!!g.paga_alumno,
    clases:cl,mats:ma.concat(general.filter(m=>!ma.some(x=>x.id===m.id))),tareas:ta,notas:ev,hab:ha,logros:lo,reco:re[0]?re[0].texto:'',diplomas:di,chat:ms,fac:fa,
    saldo:pend.reduce((a,x)=>a+Number(x.monto||0),0),prox,
    dadas:cl.filter(c=>c.estado==='dada').length};
}

P.inicio=()=>{const k=K(),L=lvl(k.xp),len=2*Math.PI*84;

function radar(h){const n=h.length,R=120,cx=170,cy=150;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5]};
  let g='';for(let r=1;r<=5;r++)g+='<polygon points="'+h.map((_,i)=>pt(i,r).join(',')).join(' ')+'" fill="none" stroke="rgba(37,37,40,.15)" stroke-width="'+(r===5?2:1)+'"/>';
  h.forEach((x,i)=>{const[a,b]=pt(i,5.9);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+pt(i,5)[0]+'" y2="'+pt(i,5)[1]+'" stroke="rgba(37,37,40,.12)"/><text x="'+a+'" y="'+(b+5)+'" text-anchor="middle" font-size="15" fill="#252528" font-family="Lato,sans-serif">'+esc(x[0])+'</text>'});
  return '<svg class="radar" viewBox="0 0 340 310" role="img" aria-label="Gráfico de habilidades">'+g+'<polygon class="poly" points="'+h.map((x,i)=>pt(i,x[1]).join(',')).join(' ')+'"/>'+h.map((x,i)=>{const p=pt(i,x[1]);return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#E4664F"/>'}).join('')+'</svg>'}
function line(n){const W=520,H=230,pl=54,pr=16,pt=16,pb=40,max=100,xs=i=>pl+i*(W-pl-pr)/(n.length-1||1),ys=v=>pt+(H-pt-pb)*(1-v/max);
  const pts=n.map((x,i)=>[n.length===1?(pl+W-pr)/2:xs(i),ys(x[1])]);let g='';[0,50,70,100].forEach(v=>g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="rgba(37,37,40,'+(v===70?.35:.1)+')" stroke-dasharray="'+(v===70?'6 6':'0')+'"/><text x="'+(pl-8)+'" y="'+(ys(v)+4)+'" text-anchor="end">'+v+'</text>');
  g+='<text x="'+(W-pr)+'" y="'+(ys(70)-6)+'" text-anchor="end" fill="#8B1A2A">meta 70</text>';
  const lbl=s=>{s=String(s);return esc(s.length>9?s.slice(0,8)+'…':s)};
  return '<svg class="linech" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Punteo de evaluaciones">'+g+'<path class="area" d="M'+pts[0][0]+' '+ys(0)+' L'+pts.map(p=>p.join(' ')).join(' L')+' L'+pts[pts.length-1][0]+' '+ys(0)+'z"/><path class="ln" d="M'+pts.map(p=>p.join(' ')).join(' L')+'"/>'+pts.map((p,i)=>'<circle class="dot" cx="'+p[0]+'" cy="'+p[1]+'" r="7"/><text x="'+p[0]+'" y="'+(H-14)+'" text-anchor="middle">'+lbl(n[i][0])+'</text><text x="'+p[0]+'" y="'+(p[1]-14)+'" text-anchor="middle" style="fill:#252528">'+n[i][1]+'</text>').join('')+'</svg>'}
function kidsSwitch(){if(S.rol!=='encargado'||S.kids.length<2)return '';return '<div class="kid">'+S.kids.map(k=>'<button type="button" data-kid="'+k.id+'" aria-pressed="'+(S.kid===k.id)+'"><span class="av"><span class="iso"></span></span><span style="text-align:left">'+esc(k.apodo||String(k.nombre).split(' ')[0])+'<br><small style="color:var(--muted)">'+(k.area==='ingles'?'Inglés':'Música')+'</small></span></button>').join('')+'</div>'}

function matCard(m){return '<div class="card mat"><div class="ic '+(m.tipo==='pdf'||m.tipo==='otro'||m.tipo==='imagen'||m.tipo==='enlace'?'pdf':m.tipo)+'">'+ic(tipoIc(m.tipo))+'</div><h3 style="font-size:1.5rem">'+esc(m.titulo)+'</h3><span class="sub">'+tipoNom(m.tipo)+(m.categoria&&m.categoria!=='material'&&m.categoria!=='otro'?' · '+esc({hoja:'Hoja de trabajo',ejercicio:'Ejercicio',sesion:'Sesión'}[m.categoria]||''):'')+'</span>'+(m.ruta?(m.tipo==='audio'?'<button class="btn" type="button" data-aud="'+esc(m.ruta)+'">'+ic('play')+'Escuchar</button>':'<button class="btn ghost" type="button" data-open="'+esc(m.ruta)+'">'+ic(m.tipo==='enlace'?'bolt':'down')+(m.tipo==='enlace'?'Abrir':'Descargar')+'</button>'):'')+'</div>'}
P.material=()=>{const k=K(),pa=S.rol==='encargado';

   +(mias.length?'<div class="card" style="margin-top:22px"><h2>Mis subidas</h2><div class="ls" style="margin-top:10px">'+mias.map(m=>'<div class="it">'+ic('up')+'<div>'+esc(m.titulo)+'<small>Tu profe ya puede verlo · '+esc(corta(m.creado))+'</small></div>'+(m.ruta?'<button class="btn ghost" type="button" data-open="'+esc(m.ruta)+'">'+ic('down')+'Abrir</button>':'')+'</div>').join('')+'</div></div>':'')+'</section>'};
P.material.bind=()=>{
  $$('[data-open]').forEach(b=>b.onclick=()=>abrir('academy',b.dataset.open));
  $$('[data-aud]').forEach(b=>b.onclick=async()=>{const u=await urlFirmada('academy',b.dataset.aud);if(!u){aviso('No se pudo abrir el audio');return}
    const a=document.createElement('audio');a.controls=true;a.autoplay=true;a.src=u;a.style.width='100%';b.replaceWith(a)});
  const u=$('#up');if(!u)return;
  u.onchange=async()=>{const f=u.files[0];if(!f)return;const k=K();
    if(f.size>25*1024*1024){aviso('El archivo pesa más de 25 MB');u.value='';return}
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    const tipo=ext==='pdf'?'pdf':['mp3','m4a','wav'].includes(ext)?'audio':['mp4','mov'].includes(ext)?'video':['png','jpg','jpeg'].includes(ext)?'imagen':'otro';
    const limpio=f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_');
    const ruta=k.id+'/alumno/'+Date.now()+'-'+limpio;$('#upmsg').textContent='Subiendo…';
    try{const r=await api('/storage/v1/object/academy/'+ruta,{method:'POST',raw:true,body:f,headers:{'Content-Type':f.type||'application/octet-stream'}});
      if(!r.ok)throw 0;
      const x=await api('/rest/v1/ac_materiales',{method:'POST',body:{estudiante_id:k.id,categoria:'otro',titulo:f.name,tipo,ruta,subido_por:'alumno'},headers:{Prefer:'return=representation'}});
      if(!x.ok)throw 0;const j=await x.json();k.mats.unshift(j[0]||{titulo:f.name,tipo,ruta,subido_por:'alumno',creado:new Date().toISOString()});
      aviso('¡Listo! Tu profe ya puede verlo.');render()}
    catch(e){$('#upmsg').textContent='No se pudo subir. Intenta de nuevo.';}};
};

const DX=[0,-70,-90,-50,0,70,90,50];
function nodosCamino(k){
  const cl=k.clases.slice().sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||''))).filter(c=>c.estado!=='cancelada');
  const out=[];let u=0,now=false;
  cl.forEach((c,i)=>{
    if(i%4===0)out.push(['unit','Unidad '+(++u)]);
    const t=c.estado==='dada'?'done':(!now?(now=true,'now'):'lock');
    out.push([t,c.titulo,10,DX[i%8],c]);
    if((i+1)%4===0)out.push(['chest','Cofre '+u,25,0]);
  });
  return out;
}
P.camino=()=>{const k=K(),N=nodosCamino(k);
  if(!N.length)return '<section class="page"><div class="ph"><h1>Mi camino</h1><p>Cada círculo es una lección. Termina uno para abrir el siguiente.</p></div><div class="card">'+vacio('Tu camino aparece cuando tu profe arme tu programa de clases.')+'</div></section>';
  let y=70,pts=[],out='',CX=190,H=0;
  N.forEach((n,i)=>{if(n[0]==='unit'){out+='<div class="unit" style="top:'+(y-26)+'px"><span>'+esc(n[1])+'</span></div>';y+=84;return}
    pts.push([CX+n[3],y,n,i]);y+=122});H=y+10;
  let path='';pts.forEach((p,i)=>{if(!i)path='M'+p[0]+' '+p[1];else{const q=pts[i-1];path+=' C '+q[0]+' '+(q[1]+60)+' '+p[0]+' '+(p[1]-60)+' '+p[0]+' '+p[1]}});
  const nodes=pts.map((p,i)=>{const n=p[2],t=n[0],prevLock=pts[i-1]&&pts[i-1][2][0]==='lock'||pts[i-1]&&pts[i-1][2][0]==='now',cls=t==='chest'?'chest'+(prevLock?' lock':''):t,icon=t==='done'?'check':t==='now'?'play':t==='chest'?'gift':'lock';
    const label=t==='now'?'<div class="start" style="left:'+p[0]+'px;top:'+(p[1]-58)+'px">¡Sigue aquí!</div>':'';
    return label+'<button type="button" class="node '+cls+'" style="left:'+p[0]+'px;top:'+p[1]+'px" data-i="'+p[3]+'" aria-label="'+esc(n[1])+'">'+ic(icon)+'</button>'}).join('');
  return '<section class="page"><div class="ph"><h1>Mi camino</h1><p>Cada círculo es una clase de tu programa. Las que ya diste se abren con una palomita.</p></div><div class="card" style="padding-bottom:36px"><div class="wayw" data-h="'+H+'"><div class="way" style="height:'+H+'px"><svg viewBox="0 0 380 '+H+'" preserveAspectRatio="xMidYMin meet"><path d="'+path+'" fill="none" stroke="rgba(37,37,40,.18)" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 22"/></svg>'+out+nodes+'</div></div></div></section>'};
P.camino.bind=()=>{const N=nodosCamino(K()),w=$('.wayw'),wy=$('.way');if(!w)return;const H=+w.dataset.h,fit=()=>{const sc=Math.min(1,w.clientWidth/380);wy.style.transform='scale('+sc+')';w.style.height=(H*sc)+'px'};fit();addEventListener('resize',fit);
  $$('.node').forEach(b=>b.onclick=()=>{const n=N[+b.dataset.i],t=n[0],c=n[4];
    const cuando=c?esc(fecha(c.fecha))+(c.hora?' · '+esc(hora(c.hora)):''):'';
    const msg=t==='done'?'¡Clase completada'+(cuando?' ('+cuando+')':'')+'! Puedes repasarla cuando quieras.':t==='now'?'Es tu próxima clase: '+cuando+'.':t==='chest'?'Un cofre de recompensa. Se abre al terminar las clases anteriores.':'Todavía está bloqueada. Termina la clase anterior para abrirla.';
    $('#sheet').innerHTML='<h3>'+esc(n[1])+'</h3><p class="sub" style="margin:8px 0 14px">'+msg+'</p><button class="btn ghost" type="button" id="sh-ok">Cerrar</button>';

    try{const r=await api('/rest/v1/ac_materiales?id=eq.'+b.dataset.del,{method:'DELETE',headers:{Prefer:'return=minimal'}});if(!r.ok)throw 0;
      S.doc.mats=S.doc.mats.filter(m=>m.id!==b.dataset.del);aviso('Material quitado');render()}catch(e){aviso('No se pudo quitar')}})};
P['d-alumnos']=()=>{const d=S.doc;
  return '<section class="page"><div class="ph"><h1>Alumnos</h1><p>Tus alumnos activos. Toca uno para subirle material.</p></div><div class="card">'+(d.alumnos.length?'<div class="ls">'+d.alumnos.map(a=>'<div class="it">'+ic('users')+'<div>'+esc(a.nombre)+'<small>'+(a.area==='ingles'?'Inglés':'Música')+(a.detalle?' · '+esc(a.detalle):'')+' · '+d.mats.filter(m=>m.estudiante_id===a.id&&m.subido_por==='academy').length+' archivos</small></div><button class="btn ghost" type="button" data-para="'+a.id+'">'+ic('up')+'Subir</button></div>').join('')+'</div>':vacio('Aún no hay alumnos activos.'))+'</div></section>'};
P['d-alumnos'].bind=()=>$$('[data-para]').forEach(b=>b.onclick=()=>{S.doc.para=b.dataset.para;go('d-subir')});

/* ---------- efectos ---------- */
function confetti(el){const r=el.getBoundingClientRect(),cs=['#E0B63E','#E4664F','#3FA7A3','#6E7A3D','#8B1A2A'];for(let i=0;i<26;i++){const c=document.createElement('i');c.className='cf';c.style.cssText='left:'+(r.left+r.width/2)+'px;top:'+(r.top+r.height/2)+'px;background:'+cs[i%5]+';--dx:'+((Math.random()-.5)*320)+'px;--dy:'+(Math.random()*-220-30)+'px;--r:'+(Math.random()*720)+'deg';document.body.append(c);setTimeout(()=>c.remove(),1400)}}
document.addEventListener('click',async e=>{const kb=e.target.closest('[data-kid]');if(kb&&S.rol==='encargado'){S.kid=kb.dataset.kid;if(!S.D[S.kid])S.D[S.kid]=await cargarAlumno(S.kid);render()}});

/* ---------- pintar ---------- */
function render(){
  clearInterval(S.timer);
  $('#login').hidden=!!S.rol;$('.app').style.display=S.rol?'':'none';$('#out').hidden=!S.rol;
  if(!S.rol){loginUI();return}
  renderSide();const f=P[S.page]||P[NAV[S.rol][0][0]];$('#main').innerHTML=f();f.bind&&f.bind();
}

/* ---------- ingreso ---------- */
const TXT={do:['Ingreso de docentes','Escribe el usuario y la contraseña que te dio Faro Academy para subir material.'],al:['Ingreso estudiantes','Escribe el usuario y la contraseña que te dio Faro Academy.'],pa:['Ingreso de encargados','Escribe el usuario y la contraseña que te dio Faro Academy.'],cl:['Tu espacio de cliente','Escribe tu correo y el código que te dimos para ver tu galería, contrato y entregas.']};
function loginUI(msg){
  const t=S.tab,cl=t==='cl';
  $('#login').innerHTML='<div class="lg-card"><div class="mascot"><span class="iso"></span></div>'
   +'<div class="chips" role="tablist" aria-label="Tipo de acceso" style="justify-content:center">'+[['al','Estudiante'],['pa','Encargado'],['do','Docente'],['cl','Cliente Studios']].map(x=>'<button class="chip" type="button" role="tab" data-t="'+x[0]+'" aria-pressed="'+(t===x[0])+'">'+x[1]+'</button>').join('')+'</div>'
   +'<h1>'+TXT[t][0]+'</h1><p class="sub">'+TXT[t][1]+'</p>'
   +'<form id="lf" autocomplete="on" style="display:grid;gap:14px;width:100%">'
   +(cl?'<label>Correo<input id="lu" type="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required></label><label>Código<input id="lp" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" required></label>'
       :'<label>Usuario<input id="lu" placeholder="'+(t==='pa'?'enc-ana-k7m':t==='do'?'doc-ana-k7m':'ana-k7m')+'" autocomplete="username" autocapitalize="none" required></label><label>Contraseña<input id="lp" type="password" placeholder="XXXX-XXXX-XXXX" autocomplete="current-password" required></label>')
   +'<p id="le" class="sub" role="alert" style="color:var(--borgona);min-height:1.2em;text-align:center">'+esc(msg||'')+'</p>'
   +'<button class="btn '+(cl?'y':'')+'" type="submit" id="lb">Entrar</button></form>'
   +'<a class="btn wa" target="_blank" rel="noopener" href="'+WA+'">¿No tienes acceso? Escríbenos</a></div>';
  $$('#login [data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;loginUI()});
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;b.textContent='Entrando…';
    const u=$('#lu').value.trim(),p=$('#lp').value;let ok=false;
    try{let email;
      if(cl){const r=await fetch(SBU+'/rest/v1/rpc/cl_email_acceso',{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+SBK,'Content-Type':'application/json'},body:JSON.stringify({p_correo:u})});
        email=r.ok?await r.json():null}
      else email=u.toLowerCase().replace(/\s+/g,'')+'@acceso.farostudios.net';
      if(email){let s=await signIn(email,p);if(!s&&normClave(p)!==p)s=await signIn(email,normClave(p));ok=!!s}}catch(e){}
    if(!ok){loginUI('Usuario o contraseña incorrectos. Revisa los datos que te enviamos.');return}
    await iniciar()};
}
async function iniciar(){
  try{const r=await api('/rest/v1/rpc/ac_mi_perfil',{method:'POST',body:{}});const p=r.ok?await r.json():{};
    if(!p||!p.rol){salir(true);loginUI('Tu acceso no está activo. Escríbenos por WhatsApp y lo revisamos.');return}
    S.perfil=p;S.rol=p.rol;
    if(p.rol==='alumno'){S.kid=p.alumno.id;S.kids=[p.alumno];S.D[S.kid]=await cargarAlumno(S.kid);S.page='inicio'}
    else if(p.rol==='encargado'){S.kids=p.hijos||[];if(!S.kids.length){salir(true);loginUI('Todavía no hay estudiantes vinculados a tu acceso. Escríbenos por WhatsApp.');return}
      S.kid=S.kids[0].id;S.D[S.kid]=await cargarAlumno(S.kid);S.page='resumen'}
    else if(p.rol==='docente'){S.doc=await cargarDocente(p);S.page='d-inicio'}
    else{S.cli=await cargarCliente(p.cliente.id);S.page='c-inicio'}
    render()}
  catch(e){if(e.message!=='sesion'){salir(true);loginUI('No pudimos entrar ahora. Intenta de nuevo en un momento.')}}
}
function salir(silencio){SES=null;try{sessionStorage.removeItem('faro_portal')}catch(e){}S.rol=null;S.D={};S.cli=null;S.doc=null;S.perfil=null;if(!silencio){render()}}
$('#out').onclick=()=>salir();
(function(){const q=new URLSearchParams(location.search).get('r');if(['al','pa','do','cl'].includes(q))S.tab=q;
  if(SES&&SES.access)iniciar();else render()})();

/* ---------- textura de papel ---------- */
(function(){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
  x.fillStyle='#F6F2EA';x.fillRect(0,0,512,512);
  for(let i=0;i<10000;i++){x.fillStyle='rgba('+(60+Math.random()*60|0)+','+(50+Math.random()*50|0)+',40,'+Math.random()*.07+')';x.fillRect(Math.random()*512|0,Math.random()*512|0,1,1)}
  x.lineWidth=.7;
  for(let i=0;i<950;i++){const a=Math.random()*512,b=Math.random()*512,l=6+Math.random()*18,t=Math.random()*6.28;
    x.strokeStyle='rgba(120,100,80,'+(.05+Math.random()*.07)+')';x.beginPath();x.moveTo(a,b);
    x.quadraticCurveTo(a+Math.cos(t)*l/2+Math.random()*4,b+Math.sin(t)*l/2+Math.random()*4,a+Math.cos(t)*l,b+Math.sin(t)*l);x.stroke()}
  document.documentElement.style.setProperty('--paper','url('+c.toDataURL()+')');
})();
</script>
</body>
