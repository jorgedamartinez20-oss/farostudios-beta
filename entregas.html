*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.55 var(--body);color:var(--ink);background:#F6F2EA;min-height:100vh;-webkit-font-smoothing:antialiased}
body.g{background:var(--g-bg);color:var(--g-tx)}
h1,h2,h3,p{margin:0;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--borgona);outline-offset:2px;border-radius:6px}
.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.iso{display:inline-block;background:currentColor;-webkit-mask:var(--iso) center/contain no-repeat;mask:var(--iso) center/contain no-repeat;aspect-ratio:160/311}
.dots::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.08;background-image:radial-gradient(circle,#252528 1px,transparent 1.2px);background-size:26px 26px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 16px;font-size:.9rem;transition:transform .15s,box-shadow .15s,background .15s;box-shadow:0 2px 0 var(--line)}
.btn:hover{transform:translateY(-1px)}
.btn.p{background:var(--borgona);color:var(--marfil);border-color:var(--borgona);box-shadow:0 3px 0 #5e101c}
.btn.o{background:var(--oro);border-color:var(--oro);color:var(--pizarra);box-shadow:0 3px 0 #8f7a48}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 3px 0 #2a5738}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.s{padding:6px 11px;font-size:.82rem;border-radius:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--pizarra);color:var(--marfil);padding:11px 20px;border-radius:14px;font-size:.9rem;z-index:99;box-shadow:0 12px 30px -8px rgba(0,0,0,.5)}

/* ---------- entrada ---------- */
.lg{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
.lg-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 2px 0 var(--line),0 30px 50px -28px rgba(37,37,40,.55);overflow:hidden}
.lg-top{background:var(--pizarra);color:var(--marfil);padding:30px 24px 24px;text-align:center}
.lg-top .iso{height:58px;color:var(--oro)}
.lg-top h1{font:400 2rem/1 var(--display);letter-spacing:.14em;margin-top:12px}
.lg-top p{font-size:.85rem;color:#c9c4ba;margin-top:6px;font-weight:300;letter-spacing:.04em}
.lg-body{padding:26px 26px 28px;display:grid;gap:14px}
.lg-body label{display:grid;gap:6px;font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lg-body input{font:400 1rem var(--body);padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.lg-body .err{min-height:1.2em;color:var(--borgona);font-size:.85rem;text-align:center}
.lg-body .btn{justify-content:center;padding:12px}
.lg-wa{text-align:center;font-size:.82rem;color:var(--muted)}
.lg-wa a{color:var(--borgona)}

/* ---------- barra ---------- */

const ESTADOS={borrador:['Borrador',''],en_revision:['En revisión','rev'],cambios_pedidos:['Cambios enviados','cam'],aprobado:['Aprobado','apr'],entregado:['Entregado','apr']};
const estPill=e=>{const x=ESTADOS[e]||['',''];return '<span class="est '+x[1]+'"><i></i>'+x[0]+'</span>'};

/* ---------- enlaces temporales de los archivos ---------- */
async function enlaces(ids){
  if(Date.now()-ST.linksAt>90*60000){ST.links={};ST.linksAt=Date.now()}
  const falta=ids.filter(i=>!ST.links[i]),lotes=[];
  for(let i=0;i<falta.length;i+=80)lotes.push(falta.slice(i,i+80));
  if(!lotes.length)return;
  if(SES&&SES.exp-60000<Date.now())await refreshSes();
  const uno=async lote=>{
    try{const r=await fetch(FILES+'/api/mi/enlaces',{method:'POST',headers:{Authorization:'Bearer '+SES.access,'Content-Type':'application/json'},body:JSON.stringify({ids:lote})});
      if(r.status===401){salir('Tu sesión venció. Vuelve a entrar.');return}
      const j=await r.json();Object.assign(ST.links,j.enlaces||{})}catch(e){}
  };
  await Promise.all(lotes.map(uno));
}
function descargar(id){const l=ST.links[id];if(!l||!l.url){toast('Podrás descargarlo cuando se apruebe');return}
  const a=document.createElement('a');a.href=l.url;a.rel='noopener';document.body.append(a);a.click();a.remove()}

/* ---------- entrada ---------- */
function pantallaLogin(msg){
  APP.innerHTML='<div class="lg"><div class="lg-card"><div class="lg-top"><span class="iso"></span><h1>ENTREGAS</h1><p>Faro Studios</p></div>'
   +'<form class="lg-body" id="lf" autocomplete="on"><label>Correo<input id="lu" type="email" autocomplete="username" autocapitalize="none" placeholder="tucorreo@ejemplo.com" required></label>'
   +'<label>Contraseña<input id="lp" type="password" autocomplete="current-password" required></label>'
   +'<p class="err" id="le" role="alert">'+esc(msg||'')+'</p><button class="btn p" type="submit" id="lb">Entrar</button>'
   +'<p class="lg-wa">¿No tienes acceso? <a href="'+WA+'" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p></form></div></div>';
  $('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;b.textContent='Entrando…';
    const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;
    gCorIni();
    let s=await signIn(authEmail(u),p);if(!s&&normClave(p)!==p)s=await signIn(authEmail(u),normClave(p));
    if(!s){pantallaLogin(/confirm/i.test(LASTERR)?'Tu acceso aún no está activado. Escríbenos por WhatsApp.':'Correo o contraseña incorrectos. Revisa los datos que te enviamos.');gCorFin();return}
    await arrancar();await gCorFin()};
}
async function arrancar(){
  APP.innerHTML='<div class="lg"><p style="position:relative;color:var(--muted)">Cargando…</p></div>';
  let perfil=null;
  try{const r=await api('/rest/v1/rpc/en_mi_perfil',{method:'POST',body:{}});perfil=r.ok?await r.json():null}catch(e){if(!SES)return}
  if(!perfil||!perfil.tipo){salir('Tu acceso no está activo. Escríbenos por WhatsApp y lo revisamos.');return}
  ST.perfil=perfil;ST.proyectos=await rows('en_proyectos','select=*&order=creado.desc');
  if(ST.proyectos.length===1)return abrirProyecto(ST.proyectos[0].id,true);
  inicio();
}
function barra(extra){return '<header class="top"><span class="iso"></span><div><b>ENTREGAS</b><small>Faro Studios</small></div><span class="sp"></span>'+(extra||'')+'<button class="btn s" id="bsal">'+ic('out')+' Salir</button></header>'}
function ligarBarra(){const b=$('#bsal');if(b)b.onclick=()=>salir('')}

/* ---------- lista de proyectos ---------- */
function inicio(){
  ST.p=null;document.body.className='dots';document.body.removeAttribute('style');
  const pr=ST.proyectos,t=ST.perfil.tipo;
  APP.innerHTML=barra()+'<main class="wrap"><div class="hello"><h2>Hola, '+esc(ST.perfil.nombre)+'</h2><p>'
    +(t==='galeria'?'Aquí están tus galerías.':'Aquí está el material de tus proyectos.')+'</p><span class="tipo">'+TIPOS[t]+'</span></div>'
    +(pr.length?'<div class="cards">'+pr.map(p=>{
      const rd=t==='galeria'?'':'<small>'+(p.rondas_max?'Ronda '+p.ronda+' de '+p.rondas_max:'Ronda '+p.ronda)+'</small>';
      return '<button class="pc" data-id="'+p.id+'"><div class="cv" data-cv="'+p.id+'">'+ic(t==='galeria'?'img':'film')+'</div><div class="in"><h3>'+esc(p.titulo)+'</h3>'+(t==='galeria'?'':estPill(p.estado))+rd+(p.descripcion?'<small>'+esc(p.descripcion)+'</small>':'')+'</div></button>'}).join('')+'</div>'
     :'<div class="vacio">'+ic('folder')+'<p style="margin-top:8px">Todavía no hay material disponible. Te avisaremos cuando esté listo.</p></div>')+'</main>';
  ligarBarra();APP.querySelectorAll('.pc').forEach(b=>b.onclick=()=>abrirProyecto(b.dataset.id));
}

async function abrirProyecto(id,unico){
  const p=ST.proyectos.find(x=>x.id===id);if(!p)return inicio();
  ST.p=p;ST.unico=!!unico;ST.sel=0;ST.borrador={v:'nota'};
  APP.innerHTML='<div class="lg"><p style="position:relative;color:var(--muted)">Abriendo…</p></div>';
  const [arch,com,favs]=await Promise.all([rows('en_archivos','proyecto_id=eq.'+id+(PREVIA?'&habilitado=eq.true':'')+'&select=*&order=orden.asc,creado.asc'),rows('en_comentarios','proyecto_id=eq.'+id+'&order=creado.asc'),rows('en_favoritos','select=archivo_id')]);
  ST.arch=arch;ST.com=com;ST.favs=new Set(favs.map(f=>f.archivo_id));
  if(ST.perfil.tipo==='galeria')await vistaGaleria();else await vistaRevision();
}

/* ================= REVISIÓN (empresa y agencia) ================= */
const cur=()=>ST.arch[ST.sel];
function textoRegla(){
  const p=ST.p,t=ST.perfil.tipo;
  if(p.estado==='en_revision'){
    if(t==='empresa'&&p.rondas_max)return '<b>Ronda '+p.ronda+' de '+p.rondas_max+'.</b> Tu proyecto incluye '+p.rondas_max+' rondas de cambios. Mira cada pieza, deja tus notas (puedes marcar el minuto exacto) y, cuando termines con todas, toca <b>Enviar ronda</b>. Reúne todas tus correcciones antes de enviarla.';
    return '<b>Ronda '+p.ronda+'.</b> Mira cada pieza, deja tus notas y, cuando termines, toca <b>Enviar ronda</b>. Puedes pedir los cambios que necesites.';
  }
  if(p.estado==='cambios_pedidos')return 'Recibimos tu <b>ronda '+p.ronda+'</b>. Estamos trabajando en los cambios; te avisaremos cuando haya una nueva versión.';
  if(p.estado==='aprobado'||p.estado==='entregado')return '<b>Todo aprobado.</b> Ya puedes descargar tus archivos.';
  return '';
}
async function vistaRevision(){
  const p=ST.p,editable=p.estado==='en_revision';
  await enlaces(ST.arch.map(a=>a.id));
  const nBor=ST.com.filter(c=>!c.enviado&&c.ronda===p.ronda).length;
  const nApr=ST.arch.filter(a=>a.estado==='aprobado').length;
  APP.innerHTML=barra()
   +'<div class="rv-top">'+(ST.unico?'':'<button class="btn s" id="bvol">'+ic('back')+' Proyectos</button>')+'<h2>'+esc(p.titulo)+'</h2>'
   +'<span class="pill b">'+(p.rondas_max?'Ronda '+p.ronda+' de '+p.rondas_max:'Ronda '+p.ronda)+'</span>'+estPill(p.estado)
   +'<span class="sp"></span><span class="pill">'+nApr+' de '+ST.arch.length+' aprobados</span>'
   +(editable?'<span class="save" id="sv">Todo guardado</span><button class="btn s" id="bgu">'+ic('check')+' Guardar</button><button class="btn p s" id="ben">'+ic('send')+' Enviar ronda</button>':'')
   +'</div>'
   +'<div class="reglas'+(p.estado==='aprobado'||p.estado==='entregado'?' ok':'')+'">'+textoRegla()+'</div>'
   +(ST.arch.length?'<div class="rv"><nav class="lista" id="lis"></nav><section class="main" id="mn"></section><aside class="notas" id="nt"></aside></div>':'<div class="vacio">Aún no hay piezas para revisar.</div>');
  ligarBarra();const v=$('#bvol');if(v)v.onclick=()=>{ST.proyectos=ST.proyectos;inicio()};
  if(!ST.arch.length)return;
  const g=$('#bgu');if(g)g.onclick=()=>{guardarBorrador(true)};
  const e=$('#ben');if(e)e.onclick=confirmarEnvio;
  pintaLista();pintaPieza();
}
function pintaLista(){
  const l=$('#lis');if(!l)return;
  l.innerHTML=ST.arch.map((a,i)=>{
    const n=ST.com.filter(c=>c.archivo_id===a.id&&c.ronda===ST.p.ronda).length;
    return '<button class="it" data-i="'+i+'" aria-current="'+(i===ST.sel)+'"><span class="th">'+ic(tipoIc(a.tipo))+'</span><span class="n">'+esc(a.nombre)+'<small>'+(n?n+' nota'+(n>1?'s':''):'Sin notas')+(a.version>1?' · v'+a.version:'')+'</small></span><i class="dot '+(a.estado==='aprobado'?'apr':a.estado==='cambios'?'cam':'')+'"></i></button>'}).join('');
  l.querySelectorAll('.it').forEach(b=>b.onclick=async()=>{await guardarBorrador();ST.sel=+b.dataset.i;ST.borrador={v:'nota'};pintaLista();pintaPieza()});
}
function mediaHTML(a){
  const l=ST.links[a.id];if(!l)return '<p style="color:#bbb;padding:30px">No se pudo cargar este archivo. Recarga la página.</p>';
  const u=esc(l.urlVer);
  if(a.tipo==='video')return '<video id="pl" controls playsinline preload="metadata" src="'+u+'" controlsList="nodownload"></video>';
  if(a.tipo==='audio')return '<audio id="pl" controls preload="metadata" src="'+u+'"></audio>';
  if(a.tipo==='imagen')return '<img src="'+u+'" alt="'+esc(a.nombre)+'">';
  if(a.tipo==='pdf')return '<iframe src="'+u+'" title="'+esc(a.nombre)+'"></iframe>';
  return '<p style="color:#ddd;padding:40px;text-align:center">'+ic('file')+' '+esc(a.nombre)+'</p>';
}
function pintaPieza(){
  const a=cur(),p=ST.p,editable=p.estado==='en_revision',l=ST.links[a.id]||{};
  $('#mn').innerHTML='<div class="media">'+mediaHTML(a)+'</div><div class="tit"><h3>'+esc(a.nombre)+(a.version>1?' <span class="pill">versión '+a.version+'</span>':'')+'</h3><div class="acc">'
   +(editable?'<button class="btn s'+(a.estado==='aprobado'?' ok':'')+'" id="bap">'+ic('check')+' '+(a.estado==='aprobado'?'Aprobado':'Aprobar')+'</button><button class="btn s'+(a.estado==='cambios'?' p':'')+'" id="bca">'+ic('edit')+' Necesita cambios</button>':estPill(a.estado==='aprobado'?'aprobado':p.estado))
   +'<button class="btn s o" id="bdl"'+(l.url?'':' disabled')+'>'+ic('dl')+' Descargar</button></div></div>';
  $('#bdl').onclick=()=>descargar(a.id);
  if(editable){$('#bap').onclick=()=>marcar(a,a.estado==='aprobado'?'pendiente':'aprobado');$('#bca').onclick=()=>marcar(a,a.estado==='cambios'?'pendiente':'cambios')}
  pintaNotas();
}
function pintaNotas(){
  const a=cur(),p=ST.p,editable=p.estado==='en_revision',media=a.tipo==='video'||a.tipo==='audio';
  const mias=ST.com.filter(c=>c.archivo_id===a.id);
  const rondas=[...new Set(mias.map(c=>c.ronda))].sort((x,y)=>y-x);
  const b=ST.borrador;
  let h='<h4>Tus notas sobre esta pieza</h4>';
  if(editable){
    h+='<div class="chips" id="chv">'+[['gusta','Me gusta','thumb'],['cambio','Quiero un cambio','edit'],['nota','Nota','note']].map(x=>'<button class="chip" type="button" data-v="'+x[0]+'" aria-pressed="'+(b.v===x[0])+'">'+ic(x[2])+x[1]+'</button>').join('')+'</div>'
      +(media?'<button class="tm" type="button" id="btm">'+ic('clock')+' <span id="tmv">'+(b.t!=null?'En '+mmss(b.t):'Marcar el momento actual')+'</span></button>':'')
      +'<textarea id="tx" placeholder="'+(b.v==='gusta'?'¿Qué te gustó de esta pieza?':b.v==='cambio'?'¿Qué quieres que cambiemos? Sé lo más claro posible.':'Escribe tu nota…')+'">'+esc(b.texto||'')+'</textarea>'
      +'<button class="btn p" id="bgn">'+ic('check')+' Guardar nota</button>';
  }
  if(!mias.length)h+='<p style="color:var(--muted);font-size:.86rem">'+(editable?'Aún no hay notas aquí. Dinos qué te gusta y qué quieres cambiar.':'No dejaste notas en esta pieza.')+'</p>';
  rondas.forEach(r=>{
    h+='<div class="rt">Ronda '+r+(r===p.ronda&&editable?' · en curso':' · enviada')+'</div>';
    mias.filter(c=>c.ronda===r).forEach(c=>{
      h+='<div class="nota '+(c.valoracion==='gusta'?'g':c.valoracion==='cambio'?'c':'n')+'"><div class="h"><b>'+(c.valoracion==='gusta'?'Me gusta':c.valoracion==='cambio'?'Cambio':'Nota')+'</b>'
        +(c.segundo!=null?'<button class="t" data-s="'+c.segundo+'">'+mmss(c.segundo)+'</button>':'')
        +(!c.enviado?'<span>borrador</span><button class="x" data-del="'+c.id+'" aria-label="Quitar nota">'+ic('x')+'</button>':'')
        +'</div><div>'+esc(c.texto)+'</div></div>'});
  });
  $('#nt').innerHTML=h;
  $('#nt').querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{ST.borrador.texto=$('#tx').value;ST.borrador.v=x.dataset.v;pintaNotas()});
  const tm=$('#btm');if(tm)tm.onclick=()=>{const pl=$('#pl');if(!pl)return;ST.borrador.t=Math.floor(pl.currentTime);$('#tmv').textContent='En '+mmss(ST.borrador.t)};
  const gn=$('#bgn');if(gn)gn.onclick=()=>guardarNota();
  const tx=$('#tx');if(tx)tx.oninput=()=>{ST.borrador.texto=tx.value;const s=$('#sv');if(s){s.textContent='Sin guardar…';s.classList.remove('on')}};
  $('#nt').querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{const pl=$('#pl');if(pl){pl.currentTime=+x.dataset.s;pl.play().catch(()=>{})}});
  $('#nt').querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{
    const r=await api('/rest/v1/en_comentarios?id=eq.'+x.dataset.del,{method:'DELETE',headers:{Prefer:'return=minimal'}});
    if(r.ok){ST.com=ST.com.filter(c=>c.id!==x.dataset.del);pintaLista();pintaNotas()}else toast('No se pudo quitar')});
}
function marcaGuardado(){const s=$('#sv');if(s){s.textContent='Guardado '+new Date().toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'});s.classList.add('on')}}
async function guardarNota(){
  const a=cur(),b=ST.borrador,texto=(($('#tx')||{}).value||'').trim();
  if(!texto&&b.v!=='gusta'){toast('Escribe tu nota primero');return}
  const body={archivo_id:a.id,proyecto_id:ST.p.id,ronda:ST.p.ronda,valoracion:b.v,texto};
  if(b.t!=null)body.segundo=b.t;
  const r=await api('/rest/v1/en_comentarios',{method:'POST',body,headers:{Prefer:'return=representation'}});
  if(!r.ok){toast('No se pudo guardar. Intenta otra vez.');return}
  const j=await r.json();ST.com.push(Array.isArray(j)?j[0]:j);ST.borrador={v:'nota'};
  marcaGuardado();toast('Nota guardada');pintaLista();pintaNotas();
}
async function guardarBorrador(avisar){
  const tx=$('#tx');
  if(tx&&tx.value.trim()){await guardarNota();return}
  if(avisar){marcaGuardado();toast('Todo guardado')}
}
async function marcar(a,estado){
  const r=await api('/rest/v1/rpc/en_marcar_archivo',{method:'POST',body:{p_archivo:a.id,p_estado:estado}});
  if(!r.ok){toast('No se pudo marcar');return}
  a.estado=estado;marcaGuardado();pintaLista();pintaPieza();
  const n=ST.arch.filter(x=>x.estado==='aprobado').length;const pl=document.querySelector('.rv-top .pill:not(.b)');if(pl&&/aprobados/.test(pl.textContent))pl.textContent=n+' de '+ST.arch.length+' aprobados';
}
function confirmarEnvio(){
  const p=ST.p,apr=ST.arch.filter(a=>a.estado==='aprobado').length,cam=ST.arch.filter(a=>a.estado==='cambios').length;
  const pend=ST.arch.length-apr-cam;
  const nNotas=ST.com.filter(c=>!c.enviado&&c.ronda===p.ronda).length;
  const queda=p.rondas_max?p.rondas_max-p.ronda:null;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="bx"><h3>Enviar la ronda '+p.ronda+'</h3><div class="res"><div><b>'+apr+'</b><small>Aprobadas</small></div><div><b>'+cam+'</b><small>Con cambios</small></div><div><b>'+nNotas+'</b><small>Notas</small></div></div>'
    +(pend?'<p style="font-size:.88rem;color:var(--warn)">'+pend+' pieza'+(pend>1?'s':'')+' sin marcar. Si las envías así, las tomaremos como revisadas sin cambios.</p>':'')
    +(queda!=null?'<p style="font-size:.88rem">'+(queda>0?'Después de esta ronda te quedará'+(queda>1?'n ':' ')+queda+' ronda'+(queda>1?'s':'')+' de cambios incluida'+(queda>1?'s':'')+'.':'Esta es la <b>última ronda incluida</b> en tu proyecto. Los cambios adicionales se cotizan aparte.')+'</p>':'')
    +'<p style="font-size:.88rem;color:var(--muted)">Al enviarla ya no podrás editar estas notas. Revisa que no falte nada.</p>'
    +'<div class="acts"><button class="btn" id="mx">Seguir revisando</button><button class="btn p" id="mok">'+ic('send')+' Enviar ronda</button></div></div>';
  document.body.append(m);$('#mx',m).onclick=()=>m.remove();
  $('#mok',m).onclick=async()=>{
    const b=$('#mok',m);b.disabled=true;b.textContent='Enviando…';
    await guardarBorrador();
    const r=await api('/rest/v1/rpc/en_enviar_ronda',{method:'POST',body:{p_proyecto:p.id}});
    m.remove();
    if(!r.ok){toast('No se pudo enviar. Intenta otra vez.');return}
    toast('Ronda enviada. ¡Gracias!');
    ST.proyectos=await rows('en_proyectos','select=*&order=creado.desc');
    await abrirProyecto(p.id,ST.unico);
  };
}

/* ---------- vista previa en Workspace ---------- */
async function previaRepinta(){
  const abierta=G.abierta,y=scrollY;
  await vistaGaleria();
  if(abierta){await gAbrirMuro(true);window.scrollTo(0,y)}
}
function previaBoot(){
  APP.innerHTML='<div class="lg"><p style="position:relative;color:var(--muted)">Preparando la vista previa…</p></div>';
  let abierta=false;
  const recibe=async d=>{
    if(d.sesion&&d.sesion.access)SES={access:d.sesion.access,refresh:null,exp:d.sesion.exp||Date.now()+3000000};
    if(!SES)return;
    if(!abierta){
      abierta=true;
      ST.perfil={nombre:'Vista previa',tipo:'galeria'};
      ST.proyectos=await rows('en_proyectos','id=eq.'+encodeURIComponent(PREVIA)+'&select=*');
      if(!ST.proyectos.length){abierta=false;APP.innerHTML='<div class="lg"><p style="position:relative;color:var(--muted)">No se pudo abrir esta galería.</p></div>';return}
      if(d.config)ST.proyectos[0].config=d.config;
      await abrirProyecto(PREVIA,true);
    }else if(d.config&&ST.p){ST.p.config=d.config;previaRepinta()}
  };
  addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;const d=e.data;if(d&&d.t==='faro_previa')recibe(d)});
  try{parent.postMessage({t:'faro_previa_listo'},location.origin)}catch(e){}
}

/* ---------- arranque ---------- */
(async()=>{
  if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r));
  if(PREVIA)return previaBoot();
  let h=null;try{h=JSON.parse(sessionStorage.getItem('faro_handoff')||'null');sessionStorage.removeItem('faro_handoff')}catch(e){}
  if(h&&h.t==='en'&&h.u&&h.p){
    const u=String(h.u).trim().toLowerCase(),p=h.p;
    gCorIni();
    let s=await signIn(authEmail(u),p);if(!s&&normClave(p)!==p)s=await signIn(authEmail(u),normClave(p));
    if(s){await arrancar();return gCorFin()}
    pantallaLogin(/confirm/i.test(LASTERR)?'Tu acceso aún no está activado. Escríbenos por WhatsApp.':'Correo o contraseña incorrectos. Revisa los datos que te enviamos.');
    return gCorFin();
  }
  const lt=new URLSearchParams(location.search).get('lista');
  if(lt&&!SES)return listaPublica(lt);
  if(SES){gCorIni();await arrancar();await gCorFin()}else pantallaLogin('');
})();
</script>

<script>
/* onda al hacer click en botones, tarjetas y filas */
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  document.addEventListener('pointerdown',function(ev){
    var t=ev.target.closest&&ev.target.closest('.btn,.pc,.it,.chip');
    if(!t||t.disabled||ev.button>0)return;
    t.classList.add('rip-host');
